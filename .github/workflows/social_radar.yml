name: 24/7 Social Intent Radar Runner

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Radar Scan Cycle (Showcase Mode)
        run: |
          python -m pip install -r requirements.txt
          python radar_engine.py --mode dry-run
